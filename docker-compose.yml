services:
  localstack:
    image: localstack/localstack:4.8.1
    container_name: cloud-network-nids-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ec2,lambda,iam,events,cloudwatch
      - DEBUG=0
      - PERSISTENCE=1
    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    restart: unless-stopped
